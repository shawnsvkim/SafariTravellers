<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Safari Travellers{% endblock %}</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: ghostwhite;
            /* color: black;*/
        }


        header {
            background-color: darkslateblue;
            padding: 0 10px 10px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

            header h1 {
                color: #ffffff;
                font-size: 2.5rem;
                text-transform: uppercase;
                letter-spacing: 2px;
                font-weight: 700;
                margin: 0;
            }


        nav {
            background-color: darkslateblue;
            box-shadow: 0 3px 20px darkslateblue;
            border-top: 1px solid white;
        }

            nav ul {
                list-style: none;
                display: flex;
                justify-content: left;
                align-items: center;
            }

                nav ul li a {
                    display: block;
                    padding: 0px 75px;
                    color: #ffffff;
                    text-decoration: none;
                    font-weight: 500;
                    transition: background 0.3s ease;
                    border-right: 1px solid white;
                }

                nav ul li:last-child a {
                    border-right: none;
                }

                nav ul li a:hover {
                    background-color: rebeccapurple;
                }


        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }



        footer {
            background-color: darkslateblue;
            color: lightgrey;
            padding: 30px 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .footer-content p {
            margin-bottom: 10px;
        }

        .contact-info {
            font-style: normal;
            color: lightgrey;
        }

        .logo-container {
            padding: 10px 50px 0px 30px;
            background-color: darkslateblue;
        }

        .site-logo {
            max-height: 80px;
            width: auto;
            margin-top: 0px;
            border-radius: 70%;
        }
    </style>
</head>
<body>
    <div class="logo-container">

        <img src="C:\Users\Admin\OneDrive\Desktop\safari\1234.png" alt="Safari Travellers Logo" class="site-logo">

        <header>
            <h1>Safari Travellers</h1>
        </header>

    </div>



    <nav>
        <ul>
            <li><a href="#home">Home </a></li>
            <li><a href="#feedback">Feedback</a></li>
            <li><a href="#account">Account</a></li>
        </ul>
    </nav>

    <main>

        {% block content %}


        {% endblock %}


    </main>

    <footer>
        <div class="footer-content">

            <address class="contact-info">
                Email: support@safaritravellers.com | Phone: +254 700 000 000 <br>
                123 Professional Plaza, Nairobi, Kenya
            </address>

            <p>&copy; 2026 Safari Travellers. All rights reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
